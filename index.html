<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Kalkulator Scientific</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff8f2; color: #292522; font-family: Arial, sans-serif; }
		.calculator { width: min(100%, 390px); padding: 24px; border: 1px solid #f4e7dc; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px #7c4b261a; }
		header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
		h1 { margin: 0; font-size: 20px; }
		.badge { color: #e87526; background: #fff0e4; padding: 7px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
		.screen { min-height: 108px; margin-bottom: 18px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; overflow: hidden; border-radius: 16px; background: #fff8f2; }
		#expression { min-height: 24px; color: #8a8179; font-size: 16px; overflow-wrap: anywhere; }
		#result { font-size: 32px; font-weight: 700; overflow-wrap: anywhere; }
		.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
		button { min-height: 49px; border: 0; border-radius: 12px; background: #f7f5f3; color: #332d29; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .12s, background .12s; }
		button:hover { transform: translateY(-1px); background: #eee9e4; }
		button.function { background: #fff0e4; color: #d9661d; }
		button.operator, button.equals { background: #f58235; color: white; }
		button.equals { grid-column: span 2; }
		button.clear { color: #d9661d; }
		.hint { margin: 16px 0 0; text-align: center; color: #a09891; font-size: 12px; }
		@media (max-width: 360px) { .calculator { padding: 17px; } .keys { gap: 7px; } button { min-height: 45px; font-size: 13px; } }
	</style>
</head>
<body>
	<main class="calculator">
		<header><h1>Kalkulator Scientific</h1><span class="badge" id="angleMode">DEG</span></header>
		<section class="screen" aria-live="polite">
			<div id="expression">0</div>
			<div id="result">0</div>
		</section>
		<div class="keys">
			<button class="function" data-value="sin(">sin</button><button class="function" data-value="cos(">cos</button><button class="function" data-value="tan(">tan</button><button class="function" data-value="log(">log</button><button class="function" data-value="ln(">ln</button>
			<button class="function" data-value="sqrt(">√</button><button class="function" data-value="^2">x²</button><button class="function" data-value="^">xʸ</button><button class="function" data-value="!">n!</button><button class="function" data-action="angle">DEG</button>
			<button class="function" data-value="(">(</button><button class="function" data-value=")">)</button><button class="function" data-value="π">π</button><button class="function" data-value="e">e</button><button class="clear" data-action="back">⌫</button>
			<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="/">÷</button><button class="clear" data-action="clear">AC</button>
			<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="*">×</button><button class="operator" data-value="%">%</button>
			<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="-">−</button><button class="operator" data-value="+">+</button>
			<button data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="calculate">=</button>
		</div>
		<p class="hint">Tip: tekan Enter untuk menghitung</p>
	</main>
	<script>
		const expressionDisplay = document.querySelector('#expression');
		const resultDisplay = document.querySelector('#result');
		const angleBadge = document.querySelector('#angleMode');
		let expression = '';
		let isDegree = true;

		function render() {
			expressionDisplay.textContent = expression || '0';
		}

		function calculate() {
			if (!expression) return;
			try {
				const allowed = /^(?:[\d.+\-*/()%!^\s]|π|\b(?:sin|cos|tan|log|ln|sqrt|pi|e)\b)*$/;
				if (!allowed.test(expression)) throw new Error('Input tidak valid');
				let code = expression.replace(/π/g, 'pi').replace(/\^/g, '**');
				code = code.replace(/(\d+(?:\.\d+)?|\))!/g, 'fact($1)');
				const toRadians = value => isDegree ? value * Math.PI / 180 : value;
				const funcs = {
					sin: value => Math.sin(toRadians(value)),
					cos: value => Math.cos(toRadians(value)),
					tan: value => Math.tan(toRadians(value)),
					log: Math.log10,
					ln: Math.log,
					sqrt: Math.sqrt,
					fact: value => {
						if (!Number.isInteger(value) || value < 0 || value > 170) throw new Error('Faktorial hanya untuk bilangan bulat 0–170');
						let total = 1;
						for (let i = 2; i <= value; i++) total *= i;
						return total;
					},
					pi: Math.PI,
					e: Math.E
				};
				const value = Function(...Object.keys(funcs), `"use strict"; return (${code});`)(...Object.values(funcs));
				if (!Number.isFinite(value)) throw new Error('Hasil tidak terdefinisi');
				resultDisplay.textContent = Number(value.toPrecision(12)).toString();
			} catch (error) {
				resultDisplay.textContent = error instanceof SyntaxError ? 'Ekspresi salah' : (error.message || 'Ekspresi salah');
			}
		}

		document.querySelector('.keys').addEventListener('click', event => {
			const button = event.target.closest('button');
			if (!button) return;
			const { action, value } = button.dataset;
			if (action === 'clear') { expression = ''; resultDisplay.textContent = '0'; }
			else if (action === 'back') expression = expression.slice(0, -1);
			else if (action === 'calculate') { calculate(); return; }
			else if (action === 'angle') {
				isDegree = !isDegree;
				angleBadge.textContent = isDegree ? 'DEG' : 'RAD';
				button.textContent = isDegree ? 'DEG' : 'RAD';
			} else expression += value;
			render();
		});

		document.addEventListener('keydown', event => {
			if (/^[0-9.+\-*/()%!]$/.test(event.key)) expression += event.key;
			else if (event.key === 'Enter') { event.preventDefault(); calculate(); return; }
			else if (event.key === 'Backspace') expression = expression.slice(0, -1);
			else return;
			render();
		});
	</script>
</body>
</html>
